<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiSewa — Sewa Fasilitas Poltekkes Kemenkes Makassar</title>
<meta name="description" content="Pemesanan sewa fasilitas (lapangan, auditorium, kendaraan) yang dikelola Unit Bisnis Poltekkes Kemenkes Makassar.">
<meta name="theme-color" content="#00b7ad">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --teal:#007f78; --teal-d:#00635d; --teal-l:#d7f4f1; --tosca:#00b9ad; --lime:#cddc29; --ink:#12302d; --mute:#5b716e;
  --bg:#f3f7f6; --card:#fff; --line:#dbe6e4; --amber:#f59e0b; --red:#dc2626; --green:#16a34a;
  --r:14px; --sh:0 1px 2px rgba(16,50,46,.06),0 6px 18px rgba(16,50,46,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:76px}
h1,h2,h3{line-height:1.25;margin:0}
a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{background:#fff;color:var(--ink);border-bottom:4px solid;border-image:linear-gradient(90deg,var(--tosca),var(--lime)) 1}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.logo{height:46px;width:auto;display:block}
.brand{text-align:right}
@media(max-width:480px){.logo{height:38px}}
.brand b{display:block;font-size:18px;letter-spacing:.2px;color:var(--teal)}
.brand span{font-size:12.5px;color:var(--mute)}
.demo{background:#fef3c7;color:#78350f;font-size:13px;padding:8px 0;border-bottom:1px solid #fde68a}
main{padding:18px 0 8px}
.hero{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.hero h1{font-size:21px;margin-bottom:6px}
.hero p{margin:0;color:var(--mute);font-size:14.5px}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.steps span{background:var(--teal-l);color:var(--teal-d);font-size:12.5px;padding:5px 10px;border-radius:99px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.fcard{cursor:pointer;display:flex;flex-direction:column;border:0;text-align:left;padding:0;width:100%}
.fcard:hover{transform:translateY(-2px);transition:.15s}
.fcard .pic{height:104px;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,#d7f4f1,#eef5b8)}
.fcard .body{padding:14px}
.fcard h3{font-size:16.5px;margin-bottom:4px}
.fcard p{margin:0 0 10px;color:var(--mute);font-size:13.5px;min-height:40px}
.price{font-weight:700;color:var(--teal-d)}
.price small{font-weight:500;color:var(--mute)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--teal-d);background:var(--teal-l);border-radius:6px;padding:2px 7px;margin-bottom:8px}
.pad{padding:18px}
.back{background:none;border:0;color:var(--teal);font-weight:600;cursor:pointer;padding:0;margin-bottom:12px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}}
h2.sec{font-size:15.5px;margin:18px 0 10px}
h2.sec:first-child{margin-top:0}
table.tarif{width:100%;border-collapse:collapse;font-size:14px}
table.tarif td{padding:7px 0;border-bottom:1px dashed var(--line)}
table.tarif td:last-child{text-align:right;font-weight:600}
label{display:block;font-size:13.5px;font-weight:600;margin:12px 0 5px}
input[type=text],input[type=tel],input[type=date],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;cursor:pointer;font-weight:700;font-size:14.5px;text-align:center}
.slot small{display:block;font-weight:500;font-size:11px;color:var(--mute)}
.slot.on{background:var(--teal);border-color:var(--teal);color:#fff}
.slot.on small{color:#e6fbf9}
.slot.busy{background:#fee2e2;border-color:#fecaca;color:#991b1b;cursor:not-allowed}
.slot.busy small{color:#991b1b}
.slot.past{background:#eef2f1;color:#9aa9a6;cursor:not-allowed}
.slot.wide{padding:12px 8px}
.slots.sesi{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.check{display:flex;align-items:center;gap:9px;font-weight:500;margin:6px 0;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--teal)}
.sum{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}
.sum .line{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.sum .tot{border-top:1px solid #99f6e4;margin-top:6px;padding-top:8px;font-weight:800;font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff;min-height:44px;text-decoration:none}
.btn:hover{background:var(--teal-d)}
.btn.full{width:100%;margin-top:14px}
.btn.ghost{background:#fff;color:var(--teal-d);border:1px solid var(--line)}
.btn.ghost:hover{background:#f0fdfa}
.btn.red{background:#fff;color:var(--red);border:1px solid #fecaca}
.btn.wa{background:#16a34a}
.btn.sm{padding:7px 11px;min-height:36px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:wait}
.note{font-size:12.5px;color:var(--mute);margin-top:8px}
.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;font-size:13.5px;margin-top:10px}
.busylist{font-size:13.5px;margin:8px 0 0;padding-left:18px;color:#991b1b}
.st{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.st.Menunggu{background:#fef3c7;color:#92400e}
.st.Disetujui{background:#dbeafe;color:#1e40af}
.st.Lunas{background:#dcfce7;color:#166534}
.st.Selesai{background:#e5e7eb;color:#374151}
.st.Ditolak,.st.Batal{background:#fee2e2;color:#991b1b}
.ticket{max-width:520px;margin:0 auto;text-align:center}
.kode{font-size:28px;font-weight:800;letter-spacing:2px;color:var(--teal-d);margin:6px 0 2px}
#qr{display:inline-block;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:12px 0}
.kv{text-align:left;font-size:14px;margin-top:8px}
.kv div{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv div span:first-child{color:var(--mute);flex:none}
.kv div span:last-child{text-align:right;font-weight:600}
.langkah{text-align:left;font-size:14px;margin:14px 0 0;padding:12px 14px 12px 32px;background:#fbfdea;border:1px solid #e3ea9a;border-radius:12px}
.langkah li{margin:3px 0}
.infobox{text-align:left;font-size:14px;margin-top:14px;padding:12px 14px;background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px}
.saya{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.item .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item h3{font-size:15.5px}
.item .meta{font-size:13.5px;color:var(--mute);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:12px}
.stat b{display:block;font-size:19px;color:var(--teal-d)}
.stat span{font-size:12.5px;color:var(--mute)}
.bar{margin:9px 0}
.bar .lab{display:flex;justify-content:space-between;font-size:13.5px;gap:10px}
.bar .trk{height:10px;background:#e6efed;border-radius:99px;overflow:hidden;margin-top:4px}
.bar .fill{height:100%;background:var(--teal);border-radius:99px}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:14px}
nav.bot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav.bot a{flex:1;max-width:220px;text-align:center;padding:9px 4px 10px;text-decoration:none;color:var(--mute);font-size:12px;font-weight:600}
nav.bot a i{display:block;font-style:normal;font-size:20px;line-height:1.2}
nav.bot a.on{color:var(--teal)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#12302d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#load{position:fixed;inset:0;background:rgba(243,247,246,.7);display:none;place-items:center;z-index:15}
#load.show{display:grid}
.spin{width:38px;height:38px;border:4px solid var(--teal-l);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{header.top,nav.bot,.demo,.acts,.back{display:none!important}body{background:#fff;padding:0}.card{box-shadow:none}}
</style>
</head>

const CFG = window.SISEWA_CONFIG || {};
const API_URL = String(CFG.API_URL || '').trim();
const DEMO = !API_URL;

const KATEGORI_PENYEWA = { internal: 'Internal (mahasiswa/pegawai)', mitra: 'Instansi mitra', umum: 'Umum' };
const SESI = {
  pagi:  { mulai: 8,  selesai: 12, n: 1, label: 'Pagi', jam: '08.00–12.00' },
  siang: { mulai: 13, selesai: 17, n: 1, label: 'Siang', jam: '13.00–17.00' },
  penuh: { mulai: 8,  selesai: 17, n: 2, label: 'Sehari penuh', jam: '08.00–17.00' }
};
const STATUS_AKTIF = ['Menunggu', 'Disetujui', 'Lunas', 'Selesai']; // status yang menahan jadwal
const NAMA_SATUAN = { jam: 'jam', sesi: 'sesi', hari: 'hari' };

/* ---------- util ---------- */
const $ = (s) => document.querySelector(s);
const app = $('#app');
const pad = (n) => String(n).padStart(2, '0');
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = (n) => 'Rp' + Number(n || 0).toLocaleString('id-ID');
const isoLokal = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hariIni = () => isoLokal(new Date());
const tambahHari = (tgl, n) => { const d = new Date(tgl + 'T00:00:00'); d.setDate(d.getDate() + n); return isoLokal(d); };
const selisihHari = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const tglPanjang = (tgl) => new Date(tgl + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const tglPendek = (tgl) => new Date(tgl + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
const hpKe62 = (hp) => { let d = String(hp || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '62' + d.slice(1); else if (d.startsWith('8')) d = '62' + d; return d; };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200); }
function memuat(on) { $('#load').classList.toggle('show', !!on); }

function uraiTambahan(teks) { // "Sound system:500000;LCD:300000" -> [{nama,harga}]
  return String(teks || '').split(';').map((s) => s.trim()).filter(Boolean).map((s) => {
    const i = s.lastIndexOf(':');
    return i < 0 ? { nama: s, harga: 0 } : { nama: s.slice(0, i).trim(), harga: Number(s.slice(i + 1)) || 0 };
  });
}
function tarifFasilitas(f, kategori) { return Number(f['tarif_' + kategori]) || 0; }
function bentrok(a, b) { // dua rentang {tanggal,tanggal_selesai,mulai,selesai}
  return a.tanggal <= b.tanggal_selesai && b.tanggal <= a.tanggal_selesai && Number(a.mulai) < Number(b.selesai) && Number(b.mulai) < Number(a.selesai);
}
function waktuPesanan(b) {
  if (b.tanggal !== b.tanggal_selesai) return tglPendek(b.tanggal) + ' s.d. ' + tglPendek(b.tanggal_selesai);
  if (Number(b.mulai) === 0 && Number(b.selesai) === 24) return tglPanjang(b.tanggal) + ' (seharian)';
  return tglPanjang(b.tanggal) + ', ' + pad(b.mulai) + '.00–' + pad(b.selesai) + '.00';
}

/* ---------- lapisan data: Google Sheet (Apps Script) atau demo ---------- */
async function api(action, payload) {
  if (DEMO) { await new Promise((r) => setTimeout(r, 180)); return demoApi(action, payload || {}); }
  let res;
  try {
    // text/plain supaya tidak memicu preflight CORS di Apps Script
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, payload || {})) });
  } catch (e) { throw new Error('Tidak bisa terhubung ke server. Periksa koneksi internet.'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Jawaban server tidak terbaca. Periksa URL Web App di config.js.'); }
  if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan.');
  return j.data;
}

    if (!b) throw new Error('Kode pesanan tidak ditemukan.');

  }

    const r = susunRentang(f, x);
    if (jadwalTerisi(d, f.id).some((j) => bentrok(j, r))) throw new Error('Maaf, jadwal itu baru saja terisi. Silakan pilih waktu lain.');

  }

  if (action === 'adminStatus') {

    const b = d.booking.find((x) => x.kode === p.kode); if (!b) throw new Error('Pesanan tidak ditemukan.');
    b.status = p.status; if (p.catatan != null) b.catatan = p.catatan; demoSimpan(); return true;
  }

    demoAdmin(d, p); const x = p.data || {};
    d.blokir.push({ id: 'BL-' + acak(6), fasilitas_id: x.fasilitas_id, tanggal: x.tanggal, tanggal_selesai: x.tanggal_selesai || x.tanggal, mulai: Number(x.mulai), selesai: Number(x.selesai), keterangan: x.keterangan || '' });
    demoSimpan(); return true;
  }
  if (action === 'adminHapusBlokir') { demoAdmin(d, p); d.blokir = d.blokir.filter((x) => x.id !== p.id); demoSimpan(); return true; }
  throw new Error('Aksi tidak dikenal.');

/* Mengubah pilihan penyewa menjadi rentang waktu + jumlah satuan (aturan yang sama dipakai di Code.gs) */
function susunRentang(f, x) {
  const reTgl = /^\d{4}-\d{2}-\d{2}$/;
  if (!reTgl.test(x.tanggal || '')) throw new Error('Tanggal belum dipilih.');
  if (x.tanggal < hariIni()) throw new Error('Tanggal sudah lewat.');
  if (!KATEGORI_PENYEWA[x.kategori_penyewa]) throw new Error('Kategori penyewa belum dipilih.');
  if (!String(x.nama || '').trim()) throw new Error('Nama penyewa wajib diisi.');
  if (hpKe62(x.hp).length < 10) throw new Error('Nomor WhatsApp tidak valid.');
  if (f.satuan === 'jam') {
    const m = Number(x.mulai), s = Number(x.selesai);
    if (!Number.isInteger(m) || !Number.isInteger(s) || m < Number(f.jam_buka) || s > Number(f.jam_tutup) || s <= m) throw new Error('Jam sewa tidak valid.');
    return { tanggal: x.tanggal, tanggal_selesai: x.tanggal, mulai: m, selesai: s, jumlah: s - m };
  }
  if (f.satuan === 'sesi') {
    const ss = SESI[x.sesi]; if (!ss) throw new Error('Sesi belum dipilih.');
    return { tanggal: x.tanggal, tanggal_selesai: x.tanggal, mulai: ss.mulai, selesai: ss.selesai, jumlah: ss.n };
  }
  const akhir = reTgl.test(x.tanggal_selesai || '') ? x.tanggal_selesai : x.tanggal;
  if (akhir < x.tanggal) throw new Error('Tanggal selesai lebih awal dari tanggal mulai.');
  const n = selisihHari(x.tanggal, akhir) + 1;
  if (n > 30) throw new Error('Maksimal sewa 30 hari per pesanan.');
  return { tanggal: x.tanggal, tanggal_selesai: akhir, mulai: 0, selesai: 24, jumlah: n };
}

    }).join('') + '</div>';

function pilihSlot(j) { if (S.slots.has(j)) S.slots.delete(j); else S.slots.add(j); gambarSlot(); }
function pilihSesi(k) { S.sesi = S.sesi === k ? '' : k; gambarSlot(); }
function pilihanWaktu() { // -> {ok, pesan, data, jumlah, label}

  if (f.satuan === 'jam') {
    const a = [...S.slots].sort((x, y) => x - y);
    if (!a.length) return { ok: false, pesan: 'Pilih jam terlebih dahulu.' };
    for (let i = 1; i < a.length; i++) if (a[i] !== a[i - 1] + 1) return { ok: false, pesan: 'Jam yang dipilih harus berurutan.' };
    return { ok: true, jumlah: a.length, data: { mulai: a[0], selesai: a[a.length - 1] + 1 }, label: tglPanjang(S.tanggal) + ', ' + pad(a[0]) + '.00–' + pad(a[a.length - 1] + 1) + '.00' };
  }
  if (f.satuan === 'sesi') {
    if (!S.sesi) return { ok: false, pesan: 'Pilih sesi terlebih dahulu.' };
    const s = SESI[S.sesi];
    return { ok: true, jumlah: s.n, data: { sesi: S.sesi }, label: tglPanjang(S.tanggal) + ', ' + s.label + ' (' + s.jam + ')' };
  }
  if (terisi(S.tanggal, S.tglSelesai, 0, 24)) return { ok: false, pesan: 'Tanggal bertabrakan dengan jadwal terisi.' };
  const n = selisihHari(S.tanggal, S.tglSelesai) + 1;
  return { ok: true, jumlah: n, data: { tanggal_selesai: S.tglSelesai }, label: n > 1 ? tglPendek(S.tanggal) + ' s.d. ' + tglPendek(S.tglSelesai) : tglPanjang(S.tanggal) };
}

  const proses = list.filter((b) => b.status === 'Menunggu' || b.status === 'Disetujui');
  const jml = (a) => a.reduce((s, b) => s + (Number(b.total) || 0), 0);
  const per = {}; masuk.forEach((b) => { per[b.fasilitas] = (per[b.fasilitas] || 0) + (Number(b.total) || 0); });
  const baris = Object.keys(per).map((k) => [k, per[k]]).sort((a, b) => b[1] - a[1]), maks = baris.length ? baris[0][1] : 0;
  const namaBulan = (ym) => new Date(ym + '-01T00:00:00').toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  $('#isiAdmin').innerHTML = '<label for="rB">Periode (berdasarkan tanggal pemakaian)</label><select id="rB" onchange="S.bulan=this.value;gambarRekap()"><option value="Semua">Semua periode</option>' + bulanAda.map((m) => '<option value="' + m + '"' + (S.bulan === m ? ' selected' : '') + '>' + namaBulan(m) + '</option>').join('') + '</select>' +
    '<div class="stats" style="margin-top:14px"><div class="stat"><b>' + rp(jml(masuk)) + '</b><span>Pendapatan (Lunas + Selesai)</span></div><div class="stat"><b>' + rp(jml(proses)) + '</b><span>Masih diproses</span></div><div class="stat"><b>' + list.length + '</b><span>Jumlah pesanan</span></div><div class="stat"><b>' + masuk.length + '</b><span>Pesanan terbayar</span></div></div>' +
    '<h2 class="sec">Pendapatan per fasilitas</h2>' + (baris.length ? baris.map((r) => '<div class="bar"><div class="lab"><span>' + esc(r[0]) + '</span><b>' + rp(r[1]) + '</b></div><div class="trk"><div class="fill" style="width:' + (maks ? Math.round(r[1] / maks * 100) : 0) + '%"></div></div></div>').join('') : '<div class="empty">Belum ada pesanan terbayar pada periode ini.</div>');
}

/* ---------- mulai ---------- */
mulai();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
